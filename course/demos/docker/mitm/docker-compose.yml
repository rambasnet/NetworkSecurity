version: "3"

services:
    attacker:
        image: ubuntu:latest
        container_name: attacker
        hostname: attacker
        tty: true
        cap_add:
            - ALL
        privileged: true
        volumes:
            - ./volumes:/volumes
        networks:
            net-10.10.0.0:
                ipv4_address: 10.10.0.2

    server:
        image: ubuntu:latest
        container_name: server
        hostname: server
        tty: true
        cap_add:
            - ALL
        networks:
            net-10.10.0.0:
                ipv4_address: 10.10.0.2
        command: bash -c "
            /etc/init.d/openbsd-inetd start  &&
            /bin/services.sh &&
            tail -f /dev/null
            "

    client:
        image: ubuntu:latest
        container_name: client
        hostname: client
        tty: true
        cap_add:
            - ALL
        networks:
            net-10.10.0.0:
                ipv4_address: 10.10.0.3
        command: bash -c "
            /etc/init.d/openbsd-inetd start  &&
            tail -f /dev/null
            "

networks:
    net-10.10.0.0:
        name: net-10.10.0.0
        ipam:
            config:
                - subnet: 10.10.0.0/24
